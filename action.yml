name: 'Install C3 Compiler'
description: 'Install c3c compiler and add it to the PATH'
inputs:
  os:
    description: 'The operating system target. If omitted, will be auto-detected.'
    required: false
  arch:
    description: 'The CPU architecture. If omitted, will be auto-detected.'
    required: false
  version:
    description: 'The compiler version to install (e.g. latest, nightly, or 0.8.4)'
    required: false
    default: 'latest'
  build-type:
    description: 'The build type: "release" or "debug"'
    required: false
    default: 'release'
  github-token:
    description: 'GitHub token for querying GitHub API during nightly resolution'
    required: false
    default: ${{ github.token }}
outputs:
  c3c-path:
    description: 'The directory containing the c3c compiler executable'
    value: ${{ steps.install.outputs.c3c-path }}
  c3c:
    description: 'The path to the c3c compiler executable'
    value: ${{ steps.install.outputs.c3c }}
runs:
  using: 'composite'
  steps:
    - name: Download and install c3c
      id: install
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        OS_INPUT="${{ inputs.os }}"
        ARCH_INPUT="${{ inputs.arch }}"
        VERSION="${{ inputs.version }}"

        # 1. Resolve OS: inputs -> RUNNER_OS -> uname -s fallback
        OS="${OS_INPUT:-${RUNNER_OS:-}}"
        if [ -z "$OS" ]; then
          case "$(uname -s)" in
            Darwin*) OS="macos" ;;
            MINGW*|MSYS*|CYGWIN*) OS="windows" ;;
            *) OS="linux" ;;
          esac
        fi

        # 2. Resolve Arch: inputs -> RUNNER_ARCH -> uname -m fallback
        ARCH="${ARCH_INPUT:-${RUNNER_ARCH:-$(uname -m)}}"

        # Normalize to lowercase
        OS=$(echo "$OS" | tr '[:upper:]' '[:lower:]')
        ARCH=$(echo "$ARCH" | tr '[:upper:]' '[:lower:]')

        # 3. Match release asset naming conventions
        EXT="tar.gz"
        if [[ "$OS" =~ linux ]]; then
          ASSET="linux-static"
        elif [[ "$OS" =~ macos|darwin ]]; then
          ASSET="macos"
          EXT="zip"
        elif [[ "$OS" =~ windows|win ]]; then
          if [[ "$ARCH" =~ arm64|aarch64 ]]; then
            ASSET="windows-aarch64"
          else
            ASSET="windows"
          fi
          EXT="zip"
        elif [[ "$OS" =~ android ]]; then
          if [[ "$ARCH" =~ arm64|aarch64 ]]; then
            ASSET="android-aarch64"
          else
            ASSET="android-x86_64"
          fi
        else
          ASSET="$OS"
        fi

        SUFFIX=""
        if [ "${{ inputs.build-type }}" = "debug" ]; then
          SUFFIX="-debug"
        fi

        # 4. Resolve download URL
        if [ "$VERSION" = "latest" ]; then
          DOWNLOAD_URL="https://github.com/c3lang/c3c/releases/latest/download/c3-${ASSET}${SUFFIX}.${EXT}"
        else
          NIGHTLY=false
          if [ "$VERSION" = "nightly" ]; then
            VERSION="latest-prerelease-tag"
            NIGHTLY=true
          elif [[ "$VERSION" =~ ^[0-9] ]]; then
            VERSION="v$VERSION"
          fi

          # Validate version is >= 0.8.0
          if [[ "$VERSION" =~ ^v([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 8 ]; then
              echo "::error::C3 compiler version $VERSION is not supported (minimum version required is 0.8.0)."
              exit 1
            fi
          fi

          DOWNLOAD_URL="https://github.com/c3lang/c3c/releases/download/${VERSION}/c3-${ASSET}${SUFFIX}.${EXT}"

          # Nightly fallback: if the static tag URL has no assets yet, query the GitHub API
          if [ "$NIGHTLY" = "true" ]; then
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$DOWNLOAD_URL")
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "Tag 'latest-prerelease-tag' returned HTTP $HTTP_STATUS, falling back to GitHub API..."
              ASSET_NAME="c3-${ASSET}${SUFFIX}.${EXT}"
              CURL_ARGS=(-fsSL -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
              if [ -n "${GITHUB_TOKEN:-}" ]; then
                CURL_ARGS+=(-H "Authorization: Bearer $GITHUB_TOKEN")
              fi

              API_RESPONSE=$(curl "${CURL_ARGS[@]}" "https://api.github.com/repos/c3lang/c3c/releases?per_page=10")
              DOWNLOAD_URL=$(echo "$API_RESPONSE" \
                | grep -o '"browser_download_url": *"[^"]*'"$ASSET_NAME"'"' \
                | head -1 | grep -o 'https://[^"]*' || true)

              if [ -z "$DOWNLOAD_URL" ]; then
                echo "::error::Could not resolve a nightly download URL for asset '$ASSET_NAME' via GitHub API."
                exit 1
              fi
            fi
          fi
        fi

        echo "Downloading c3c from $DOWNLOAD_URL ..."

        INSTALL_DIR="${RUNNER_TEMP:-${{ github.action_path }}}/_c3"
        ARCHIVE_FILE="$INSTALL_DIR/archive.${EXT}"
        mkdir -p "$INSTALL_DIR"

        # Download with -f to fail on 404/500
        curl -fsSL -o "$ARCHIVE_FILE" "$DOWNLOAD_URL" || {
          echo "::error::Failed to download from $DOWNLOAD_URL"
          exit 1
        }

        # Extract archive
        if [ "$EXT" = "zip" ]; then
          unzip -q -o "$ARCHIVE_FILE" -d "$INSTALL_DIR"
        else
          tar -xzf "$ARCHIVE_FILE" -C "$INSTALL_DIR"
        fi
        rm -f "$ARCHIVE_FILE"

        C3_DIR="$INSTALL_DIR/c3"
        if [ -f "$C3_DIR/c3c.exe" ]; then
          C3C_EXE="$C3_DIR/c3c.exe"
        else
          C3C_EXE="$C3_DIR/c3c"
          chmod +x "$C3C_EXE"
        fi

        # Export outputs and add to PATH
        echo "$C3_DIR" >> "$GITHUB_PATH"
        echo "c3c-path=$C3_DIR" >> "$GITHUB_OUTPUT"
        echo "c3c=$C3C_EXE" >> "$GITHUB_OUTPUT"

branding:
  icon: package
  color: purple