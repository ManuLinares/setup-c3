name: Test Action

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}-${{ matrix.version }}-${{ matrix.build-type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-11-arm
          - windows-latest
          - ubuntu-latest
          - macos-latest
        version: [latest]
        build-type: [release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # 100% confirmation step: inspect GitHub runner variables vs uname
      - name: Confirm GitHub Runner Architecture
        shell: bash
        run: |
          echo "================ GITHUB RUNNER INFO ================"
          echo "GitHub Context runner.os:     ${{ runner.os }}"
          echo "GitHub Context runner.arch:   ${{ runner.arch }}"
          echo "Env variable RUNNER_OS:       $RUNNER_OS"
          echo "Env variable RUNNER_ARCH:     $RUNNER_ARCH"
          echo "----------------------------------------------------"
          echo "Shell uname -s:               $(uname -s)"
          echo "Shell uname -m:               $(uname -m)"
          echo "===================================================="

      - name: Setup C3 Compiler
        id: setup-c3
        uses: ./
        with:
          version: ${{ matrix.version }}
          build-type: ${{ matrix.build-type }}

      - name: Verify c3c Installation
        shell: bash
        run: |
          echo "c3c path output: ${{ steps.setup-c3.outputs.c3c-path }}"
          echo "c3c executable output: ${{ steps.setup-c3.outputs.c3c }}"
          
          echo "=== c3c details ==="
          c3c -V
          
          # Write summary to Github Actions Web console
          echo "### C3 Installation Summary (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner Arch:** \`${{ runner.arch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Compiler Directory:** \`${{ steps.setup-c3.outputs.c3c-path }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Executable Path:** \`${{ steps.setup-c3.outputs.c3c }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`$(c3c --version | head -n 1)\`" >> $GITHUB_STEP_SUMMARY